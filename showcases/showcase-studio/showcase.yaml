# =============================================================
# SHOWCASE STUDIO — the studio, showcased by itself.
#
# Every screenshot here is the app capturing its own screens, and the
# diagrams are TSX graphics from this showcase's graphics/ folder —
# exactly the workflow the narration describes.
# =============================================================

meta:
  title: Showcase Studio
  description: >
    Showcase videos as code - create, edit, and version your app's video tours inside your own repo, with Claude Code embedded, git for history, and a teleprompter that travels to your phone.
  loop: true
  soundtrack: { src: "", volume: 0.2 }
  captionStyle: karaoke

scenes:
  # ---- THE IDEA -------------------------------------------------
  - id: intro
    theme: statement
    title: "Showcase: Videos as code"
    captions:
      - text: ""
      - text: What if your app's video tours lived in your repo - written, edited, and shipped like the rest of it?
    media:
      kind: none

  # ---- THE CONCEPT ----------------------------------------------
  - id: diff
    theme: console
    eyebrow: Videos as code
    title: Change one word. Ship a new video.
    captions:
      - text: A caption fix is a one-line diff - the video re-renders itself.
      - text: The words are the timeline - rewrite a line and it re-paces.
    media:
      kind: graphic
      graphic: caption-diff
      alt: A one-line git diff of a caption re-rendering the slide beneath it

  # ---- THE PLAYER -----------------------------------------------
  - id: player
    theme: console
    eyebrow: The player
    title: One script, three renditions
    captions:
      - text: The script plays as an auto-running product tour.
      - text: App Store, TikTok, or a 4:3 embed - one source, three renditions.
    media:
      kind: image
      asset: shot-player
      alt: The Showcase Studio player with the App Screens, TikTok, and 4:3 view switch
      motion: still
      frame: full
      fadeTo:
        asset: shot-script
        alt: The script page listing every scene with derived timings

  # ---- THE AGENT ------------------------------------------------
  - id: claude
    theme: console
    eyebrow: The agent
    title: Claude Code, built in
    captions:
      - text: No bolted-on AI - Claude Code is the editor, on the subscription you already have.
      - text: It sees your slides, hears your voiceover, and runs your exports.
    media:
      kind: graphic
      graphic: claude-terminal
      alt: An embedded Claude Code session editing a scene, checking it, and exporting a draft

  # ---- THE MEDIA ------------------------------------------------
  - id: assets
    theme: console
    eyebrow: The media
    title: Every asset, accounted for
    captions:
      - text: Screenshots and voiceovers live beside the script - usage tracked, strays flagged.
    media:
      kind: image
      asset: shot-assets
      alt: The assets page showing the media collection with usage details
      motion: still
      frame: full

  # ---- VERSIONING -----------------------------------------------
  - id: git
    theme: console
    eyebrow: Versioning
    title: Branch it. Diff it. Review it.
    captions:
      - text: Plain files - so git just works.
      - text: Branch a new cut, and review the video like code.
    media:
      kind: graphic
      graphic: git-lanes
      alt: A git commit graph of a showcase folder, with a new-cut branch merging back

  # ---- RECORDING ------------------------------------------------
  - id: prompter
    theme: feature
    eyebrow: Recording
    title: Read it on your phone
    captions:
      - text: Share the teleprompter to the web, and read it from your phone.
      - text: It scrolls at speaking pace while you record your take.
    media:
      kind: image
      asset: shot-prompter
      alt: The teleprompter on a phone, scrolling the script with pacing controls
      motion: still
      frame: phone

  # ---- OUTRO ----------------------------------------------------
  - id: outro
    theme: statement
    title: Your repo is the studio
    captions:
      - text: Free and open source. Your repo is the studio.
    media:
      kind: none
