<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Showcase Studio app icon: a prompt chevron aimed at a phone that is
       playing (and editing: clip strip + playhead) a showcase, on a timeline.
       Apple's macOS grid: 1024 canvas, 824 rounded square, so the Dock draws
       it the same size as its neighbours. Render with: npm run build:icon -->
  <defs>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <linearGradient id="stage" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#182040"/><stop offset="1" stop-color="#070a16"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.12" r="0.7"><stop offset="0" stop-color="#3d84ea" stop-opacity="0.55"/><stop offset="1" stop-color="#3d84ea" stop-opacity="0"/></radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a90f0"/><stop offset="1" stop-color="#45bf82"/></linearGradient>
    <linearGradient id="accentH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4a90f0"/><stop offset="1" stop-color="#45bf82"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.1"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.3"/></linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="32"/></filter>
    <filter id="shadow"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#stage)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <ellipse cx="512" cy="900" rx="320" ry="90" fill="#45bf82" opacity="0.32" filter="url(#soft)"/>
  </g>
  <g clip-path="url(#tile)">
    <rect x="100" y="800" width="824" height="6" fill="#fff" opacity="0.12"/>
    <rect x="160" y="782" width="200" height="42" rx="12" fill="#4a90f0" opacity="0.5"/>
    <rect x="372" y="782" width="250" height="42" rx="12" fill="#45bf82" opacity="0.5"/>
    <rect x="634" y="782" width="240" height="42" rx="12" fill="#4a90f0" opacity="0.3"/>
    <rect x="581" y="770" width="6" height="66" rx="3" fill="#f2eee9"/>
  </g>
  <path d="M236 366 L372 502 L236 638" fill="none" stroke="url(#accentH)" stroke-width="60" stroke-linecap="round" stroke-linejoin="round"/>
  <g>
    <rect x="452" y="212" width="300" height="580" rx="58" fill="#000" opacity="0.6" filter="url(#shadow)" transform="translate(0 22)"/>
    <rect x="452" y="212" width="300" height="580" rx="58" fill="#0b0e1c"/>
    <rect x="452" y="212" width="300" height="580" rx="58" fill="none" stroke="url(#rim)" stroke-width="6"/>
    <rect x="470" y="230" width="264" height="544" rx="42" fill="url(#accent)"/>
    <path d="M560 412 L656 482 L560 552 Z" fill="#0a0c1a" stroke="#0a0c1a" stroke-width="26" stroke-linejoin="round" opacity="0.92"/>
    <!-- clip strip at the foot of the screen -->
    <rect x="492" y="700" width="220" height="44" rx="12" fill="#0a0c1a" opacity="0.55"/>
    <rect x="500" y="708" width="88" height="28" rx="8" fill="#f2eee9" opacity="0.85"/>
    <rect x="596" y="708" width="66" height="28" rx="8" fill="#f2eee9" opacity="0.5"/>
    <rect x="670" y="708" width="42" height="28" rx="8" fill="#f2eee9" opacity="0.3"/>
    <rect x="584" y="694" width="6" height="56" rx="3" fill="#f2eee9"/>
  </g>
</svg>
