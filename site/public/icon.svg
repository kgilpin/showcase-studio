<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 100 824 824">
  <!-- Showcase Studio app icon: a prompt chevron aimed at a phone that is
       playing a showcase, its caption's current word in the yellow
       highlight box (the word-timed captions). Brand colors only: ink tile,
       paper, caption yellow as the one accent; flat, no gradients or glows.
       Apple's macOS grid: 1024 canvas, 824 rounded square, so the Dock draws
       it the same size as its neighbours. Render with: npm run build:icon -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#121316"/>
  <path d="M220 384 L348 512 L220 640" fill="none" stroke="#F4F4F1" stroke-width="72" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the phone: paper body, ink screen -->
  <rect x="436" y="196" width="360" height="632" rx="76" fill="#F4F4F1"/>
  <rect x="468" y="228" width="296" height="568" rx="48" fill="#121316"/>
  <!-- playing -->
  <path d="M572 344 L676 412 L572 480 Z" fill="#F4F4F1" stroke="#F4F4F1" stroke-width="28" stroke-linejoin="round"/>
  <!-- the caption, its current word highlighted -->
  <rect x="500" y="580" width="232" height="104" rx="16" fill="#FFD83D"/>
  <rect x="540" y="618" width="152" height="28" rx="9" fill="#121316"/>
  <rect x="512" y="712" width="208" height="32" rx="10" fill="#F4F4F1" opacity="0.5"/>
</svg>
