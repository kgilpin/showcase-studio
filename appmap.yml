# AppMap recording config for the studio module — the app whose
# package.json is at the repo root: server/, src/, scripts/ and electron/.
# Not the whole repo: each other module has its own (cdk/appmap.yml for
# the AWS Lambdas). Recordings land in tmp/appmap (gitignored); the
# blessed gold-trace baselines live in gold_traces/.
name: showcase_demo
language: javascript
appmap_dir: tmp/appmap
packages:
  - path: server
    exclude:
      # A recursive walk over every node of a YAML document, so its call
      # count tracks the document's size and nothing else — hundreds of
      # calls that say the same thing. Its own behavior is covered by
      # server/yaml-text.test.mjs, and its callers stay in the trace.
      - blockScalars
      # Which advice the guide gives for installing whisper depends on
      # whether this machine has one — so recording it makes a trace say
      # more about the machine than about the code. The lookup itself
      # (whisperPath) stays.
      - whisperAdvice
  - path: scripts
  - path: electron
  - path: src
