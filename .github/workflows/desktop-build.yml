# Builds the desktop app on Windows and checks that it starts.
#
#   npm ci ─► setup:desktop ─► tests ─► vendor:whisper ─► build:desktop ─►
#                                       package-desktop.mjs ─► electron-builder --win zip
#                                                                     │
#                             smoke test: start the app headless, load its pages
#                                                                     │
#                                   workflow artifact: the zip and its checksum
#
# It builds on Windows itself because ffmpeg-static and esbuild install
# programs for the machine that runs npm install; a build made on a Mac
# would carry Mac programs.
#
# Runs by hand (Actions > Desktop build > Run workflow), on version tags, and
# on pull requests that touch the build. It never publishes a release: the
# zip is a workflow artifact to test first.

name: Desktop build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/desktop-build.yml"
      - "electron-builder.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "electron/**"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json

      - name: Install
        run: npm ci

      # Electron and electron-builder live in electron/package.json
      # (scripts/desktop-deps.mjs), not in the root install.
      - name: Install the desktop shell's dependencies
        run: npm --prefix electron ci

      - name: Tests
        run: npx vitest run

      # whisper.cpp's Windows build, pinned and checksummed: the app
      # ships it, and packaging fails without it.
      - name: Vendor whisper
        run: npm run vendor:whisper

      - name: Build the app server
        run: npm run build:desktop

      - name: Stage the desktop app
        run: node scripts/package-desktop.mjs

      - name: Package
        run: node scripts/electron-builder.mjs --win --publish never

      # The app is meant to transcribe out of the box; a missing binary
      # would only show up as drifting caption timings months later.
      - name: The packaged app carries whisper
        run: |
          $whisper = "dist-electron/dist/win-unpacked/resources/app/electron/vendor/whisper/whisper-cli.exe"
          if (-not (Test-Path $whisper)) { throw "No whisper-cli.exe in the packaged app" }
          & $whisper --help 2>&1 | Select-Object -First 3

      - name: Smoke test
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $exe = "dist-electron/dist/win-unpacked/Showcase Studio.exe"
          if (-not (Test-Path $exe)) { throw "No app at $exe" }

          # A copy of a showcase outside the repo, so the studio's
          # automatic git commits stay off.
          $library = Join-Path $env:RUNNER_TEMP "library"
          New-Item -ItemType Directory -Force $library | Out-Null
          Copy-Item -Recurse showcases/showcase-studio (Join-Path $library "showcase-studio")
          $showcase = Join-Path $library "showcase-studio"

          $env:PORT = "47123"
          $app = Start-Process -FilePath $exe -ArgumentList @("--open", "`"$showcase`"", "--no-window") `
            -PassThru -RedirectStandardOutput app.log -RedirectStandardError app.err.log

          $base = "http://127.0.0.1:47123"
          $up = $false
          foreach ($i in 1..90) {
            try { Invoke-WebRequest "$base/studio/api/info" -UseBasicParsing -TimeoutSec 2 | Out-Null; $up = $true; break }
            catch { Start-Sleep -Seconds 1 }
          }
          try {
            if (-not $up) { throw "The app didn't answer on $base within 90 s" }
            $info = Invoke-RestMethod "$base/studio/api/info"
            if ($info.version -ne $version) { throw "The app says version $($info.version), expected $version" }
            foreach ($path in @("/", "/showcase/showcase-studio", "/showcase/showcase-studio/assets", "/studio/api/history")) {
              $status = (Invoke-WebRequest "$base$path" -UseBasicParsing).StatusCode
              Write-Host "$status $path"
              if ($status -ne 200) { throw "$path answered $status" }
            }
          } finally {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            Get-CimInstance Win32_Process -Filter "Name = 'Showcase Studio.exe'" |
              ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
            Write-Host "--- app.log"; Get-Content app.log -ErrorAction SilentlyContinue
            Write-Host "--- app.err.log"; Get-Content app.err.log -ErrorAction SilentlyContinue
          }

      # Its own checksum file: the Mac installer checks every line of
      # SHA256SUMS, so a Windows line there would break Mac installs.
      - name: Checksum
        run: |
          $zip = Get-ChildItem dist-electron/dist/Showcase-Studio-*-win-x64.zip
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($zip.Name)" | Set-Content -NoNewline -Encoding ascii "dist-electron/dist/SHA256SUMS-win-x64"
          Get-Content dist-electron/dist/SHA256SUMS-win-x64

      # The plugin's installer, run the way Claude runs it on Windows: through
      # Git Bash, which hands over to install-app.ps1. It installs this
      # build from the local zip instead of downloading a release.
      - name: Plugin installs the app
        run: |
          $env:SHOWCASE_STUDIO_RELEASE_DIR = (Resolve-Path dist-electron/dist).Path
          $env:SHOWCASE_STUDIO_INSTALL_DIR = Join-Path $env:RUNNER_TEMP "apps"
          & "C:\Program Files\Git\bin\bash.exe" plugins/showcase-studio/bin/install-app
          if ($LASTEXITCODE -ne 0) { throw "install-app failed" }
          $exe = Join-Path $env:SHOWCASE_STUDIO_INSTALL_DIR "Showcase Studio\Showcase Studio.exe"
          if (-not (Test-Path $exe)) { throw "No app at $exe" }
          $version = (Get-Content plugins/showcase-studio/app-version -Raw).Trim()
          # Windows keeps four parts (0.2.0.0); the release has three.
          $installed = ((Get-Item $exe).VersionInfo.ProductVersion -split "\.")[0..2] -join "."
          Write-Host "Installed $installed at $exe"
          if ($installed -ne $version) { throw "Installed version $installed, expected $version" }

          # A second run finds it installed and leaves it alone.
          $again = & "C:\Program Files\Git\bin\bash.exe" plugins/showcase-studio/bin/install-app | Out-String
          Write-Host $again
          if ($again -notmatch "already installed") { throw "A second install-app run didn't see the installed app" }

      # Claude Code itself, with the plugin installed from this checkout,
      # checks that the plugin's MCP server connects. Run twice: as users
      # normally have it, and with Git Bash's sh off PATH, since which
      # launcher Windows picks (bin/studio-mcp through sh, or
      # bin/studio-mcp.cmd) isn't documented.
      - name: Claude Code connects to the plugin
        run: |
          npm install -g @anthropic-ai/claude-code
          $env:SHOWCASE_STUDIO_INSTALL_DIR = Join-Path $env:RUNNER_TEMP "apps"
          $env:CLAUDE_CODE_GIT_BASH_PATH = "C:\Program Files\Git\bin\bash.exe"
          $repo = (Get-Location).Path
          $project = Join-Path $env:RUNNER_TEMP "project"
          New-Item -ItemType Directory -Force $project | Out-Null
          Push-Location $project
          try {
            claude plugin marketplace add $repo
            claude plugin install showcase-studio@showcase-studio
            $failures = @()
            $normalPath = $env:PATH
            $noSh = ($env:PATH -split ";" | Where-Object { $_ -notmatch "\\Git\\(usr\\)?bin" }) -join ";"
            foreach ($run in @(@{ name = "PATH as installed"; path = $normalPath }, @{ name = "no sh on PATH"; path = $noSh })) {
              $env:PATH = $run.path
              Write-Host "--- claude mcp list ($($run.name)); sh: $((Get-Command sh -ErrorAction SilentlyContinue).Source)"
              $out = claude mcp list 2>&1 | Out-String
              Write-Host $out
              Get-CimInstance Win32_Process -Filter "Name = 'Showcase Studio.exe'" |
                ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
              if ($out -notmatch "plugin:showcase-studio:showcase-studio.*Connected") { $failures += $run.name }
            }
            $env:PATH = $normalPath
            if ($failures.Count -gt 0) { throw "The plugin's MCP server didn't connect with: $($failures -join ', ')" }
          } finally {
            Pop-Location
            # Claude Code's own MCP logs: which command it ran, and the
            # server's error output.
            Get-ChildItem -Recurse -File -Path $env:LOCALAPPDATA, $env:USERPROFILE -Filter *.jsonl -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match "mcp-logs.*showcase" } |
              ForEach-Object { Write-Host "--- $($_.FullName)"; Get-Content $_.FullName -Tail 40 }
          }

      - uses: actions/upload-artifact@v7
        with:
          name: showcase-studio-win-x64
          path: |
            dist-electron/dist/Showcase-Studio-*-win-x64.zip
            dist-electron/dist/SHA256SUMS-win-x64
          if-no-files-found: error
