meta:
  title: Showcase Studio
  description: "Showcase Studio is a Claude Code plugin: make videos of your app with the Claude Code subscription you already have, using every tool and file on your machine."
  loop: true
  captionStyle: karaoke
  notes: |-
    Script draft for the plugin pitch: Showcase Studio runs as a Claude Code plugin, so it uses the subscription you already have, every tool on your machine, and plain files you can share across projects.
    Voiceover: a synthesized draft, assets/voiceover-synth.m4a, made with AWS Polly's generative Matthew voice (kgilpin profile, us-east-1): one clip per caption (24 kHz mp3), each placed in a window of 250 ms lead + spoken length (rounded up to the millisecond) + 450 ms tail; the last caption holds 1.5 s more for the end card. Every caption's durationMs is pinned to its window, and the windows sum to 44788 ms, the audio's length. assets/voiceover-synth.words.json has one segment per caption window, with the caption's own words and the transcribe tool's word times fitted into the span where that caption's clip is voiced (whisper drifts across caption boundaries, so its times aren't used as they come). After any caption edit, synthesize again, re-pin, and rebuild the words file, or the voice drifts out of sync. Last made 2026-10-16, by build_voiceover (feature/synth-voiceover), which hears each clip on its own for the word times.
    These showcases ship as examples, so only the files the slides use belong in the folder. The old on-camera clip and the git scene's graphic were removed; both are in git history.
  soundtrack: { src: voiceover-synth, volume: 1, sync: true }

scenes:
  - id: setup
    theme: footage
    eyebrow: Made with
    note: "The opening shot: a screenshot of Claude Code Desktop with the studio open beside the chat, working on this very showcase (assets/showcase studio in claude.png). fit: contain keeps the landscape screenshot whole on the portrait stage."
    captions:
      - text: I made this video with Showcase Studio, a Claude Code plugin.
        durationMs: 4516
    media:
      kind: image
      asset: showcase studio in claude
      alt: Claude Code Desktop with Showcase Studio open beside the chat, playing this showcase
      fit: contain
      motion: zoom-in

  - id: plugin
    theme: console
    eyebrow: The plugin
    title: Right inside the Claude Code you already have
    captions:
      - text: Type /showcase, and the studio opens right beside your chat.
        durationMs: 4252
    media:
      kind: graphic
      graphic: showcase-command
      alt: "Claude Code Desktop: /showcase is typed into the chat, and the studio opens in the Browser pane beside it"
    note: "The graphic is graphics/showcase-command.tsx, a stylized Claude Code Desktop window: /showcase types into the chat, Claude answers, and the studio slides open in the Browser pane."
  - id: tools
    theme: console
    eyebrow: Your tools
    title: Every tool on your machine
    note: The screenshot shows Claude choosing AWS Polly voices on the user's own account to make a voiceover, with the studio playing beside the chat.
    captions:
      - text: You can use all the power and context of Claude.
        durationMs: 3412
      - text: Here it makes a voiceover with my own AWS account.
        durationMs: 3748
    media:
      kind: image
      asset: shot-claude-desktop
      alt: Claude picking an AWS Polly voice and building voiceover clips, with the studio playing beside the chat
      motion: still

  - id: prompter
    theme: feature
    eyebrow: Recording
    title: Record with the teleprompter
    captions:
      - text: You can record video using the built-in teleprompter
        durationMs: 3580
      - text: on your computer or on your phone.
        durationMs: 2764
    media:
      kind: image
      asset: shot-prompter
      alt: The teleprompter on a phone, scrolling the script with pacing controls
      motion: still
      frame: phone
  - id: files
    theme: feature
    eyebrow: Your files
    title: Plain files on your machine
    captions:
      - text: "The script, screenshots, and other media are all ordinary files on your computer."
        durationMs: 5404
      - text: Drag in a new clip or screenshot, and it's ready to use.
        durationMs: 3796
    media:
      kind: image
      asset: shot-assets-portrait
      alt: The assets page listing the project's screenshots, recordings, and where each is used
      motion: still

  - id: export
    theme: console
    eyebrow: Export
    title: One script - three exports
    captions:
      - text: When you're done, you can export in "shorts" format, widescreen, and captioned screenshots for the App Store.
        durationMs: 6676
    media:
      kind: graphic
      graphic: player-formats
      alt: One showcase.yaml fanning out to the App Store, TikTok, and YouTube renditions

  - id: outro
    theme: console
    title: Showcase Studio
    captions:
      - text: Add the Showcase Studio plugin to Claude Code, and make your first video today.
        durationMs: 6640
    media:
      kind: graphic
      graphic: plugin-install
      alt: "A terminal: the two commands that add the Showcase Studio plugin type in, each confirmed, then a hint to type /showcase in Claude Code"
    eyebrow: Get it
    cta: { kind: github, label: View on GitHub, url: https://github.com/kgilpin/showcase-studio }
    ctaNote: github.com/kgilpin/showcase-studio
    note: 'The graphic is graphics/plugin-install.tsx, a stylized terminal: the two plugin commands from the README type in as the caption starts ("Add the Showcase Studio plugin...", 0.4 s in, when the voice starts). Retime its FIRST constant if a caption is added before it.'
