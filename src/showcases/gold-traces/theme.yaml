# =============================================================
# GOLD TRACES SHOWCASE — THEME
#
# Taken from appmap.io's own stylesheet: near-black purple-tinted
# background (#150f26 → #010303 hero gradient), the brand magenta
# #C242B1 with the #925EEE purple as the accent gradient, light
# gray text (#e3e5e8 / #808b98), IBM Plex Sans + Open Sans.
# =============================================================

colors:
  background: "#010306"
  foreground: "#e3e5e8"
  card: "#171e2f"
  card-foreground: "#e3e5e8"
  primary: "#c242b1"
  primary-foreground: "#ffffff"
  secondary: "#0d0a18"
  secondary-foreground: "#e3e5e8"
  muted: "#1b1234"
  muted-foreground: "#b3bac3"
  accent: "#925eee"
  accent-foreground: "#ffffff"
  border: "rgba(146, 94, 238, 0.28)"
  support: "#808b98"

fonts:
  display: '"IBM Plex Sans", ui-sans-serif, sans-serif'
  body: '"Open Sans", ui-sans-serif, system-ui, sans-serif'
  load:
    - https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;600;700&display=swap
    - https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;700;800&display=swap

atmosphere:
  # appmap.io's hero gradient, plus a soft purple stage glow.
  gradient-stage: >-
    radial-gradient(120% 80% at 50% 12%, rgba(71, 31, 142, 0.45),
    transparent 68%), linear-gradient(180deg, #150f26 0%, #010303 60%)
  gradient-accent: "linear-gradient(45deg, #c242b1, #925eee 80%)"
  shadow-device: >-
    0 40px 120px -30px rgba(1, 3, 6, 0.9), 0 0 90px -20px
    rgba(146, 94, 238, 0.3)
