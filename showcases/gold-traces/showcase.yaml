meta:
  title: Gold Traces — Make every important change prove itself
  description: >-
    Recordings of how your code runs, committed in git and compared on
    every change. AppMap's review shows what a change really did, what is
    broken, and which test is missing, before it merges.
  notes: >-
    Script draft v3. One real case carries the story: Onlook's partial
    authorization fix (CVE-2025-63783, from github.com/evlawler/goldtrace-examples).
    Onlook is named on screen only, never in the voiceover. The dialog is
    still being edited; once it is final, record the voiceover with AWS
    Polly's generative Danielle voice and sync the captions to it. Until
    then timing derives from the copy.
  loop: true
  captionStyle: karaoke

scenes:
  - id: hook
    theme: console
    eyebrow: Hook
    title: "Onlook: tests passed, change approved, wrong for 7 months"
    note: Graphic names the repo, the CVE and the PR. The voiceover never says Onlook.
    captions:
      - text: An AI agent shipped a security fix. The tests passed, and the change was approved.
      - text: It protected five operations and missed forty. For seven months, any signed-in user could change anyone's project.
    media:
      kind: graphic
      graphic: hook
      alt: "Onlook security fix: tests passed and approved, five of about forty-five operations fixed, open for seven months"
      frame: full

  - id: risk
    theme: console
    eyebrow: Risk
    title: Every release is a bet
    captions:
      - text: Tests check what you thought to test. Code review checks what the diff says.
      - text: Neither checks what the change actually does when it runs.
    media:
      kind: graphic
      graphic: risk
      alt: Tests check what you thought to test, code review checks what the diff says, and nothing checks what the change does when it runs
      frame: full
    note: "Graphic (graphics/risk.tsx) stacks the two checks people rely on, then the gap neither covers. Staged to the narration: tests at 0s, code review at ~3s, the gap at 6.25s; restage if the captions change."

  - id: intro
    theme: statement
    title: AppMap Gold Traces
    captions:
      - text: AppMap Gold Traces lets you ship knowing, not hoping, what each change will do.
    media:
      kind: image
      asset: appmap-mark
      alt: "AppMap logo: a white A on a pink circle"
      motion: zoom-in
      frame: mark

  - id: how-it-works
    theme: console
    eyebrow: How it works
    title: Record how the code runs. Compare every change.
    captions:
      - text: Your tests run with AppMap recording. Each recording shows the calls, queries, and checks the code actually ran.
      - text: The recordings are committed as a baseline. On every change, they're recorded again and compared.
    media:
      kind: graphic
      graphic: lifecycle
      alt: Record, commit as the baseline, compare every change
      frame: full

  - id: recordings
    theme: console
    eyebrow: What the recordings showed
    title: Onlook's fix, as it actually ran
    captions:
      - text: Here's that security fix, recorded. On the operations it touched, the new membership check runs, and a stranger is refused.
      - text: On the ones it didn't touch, the same stranger still reads the project, rewrites its run command, and removes its owner.
    media:
      kind: graphic
      graphic: onlook-recordings
      alt: The operations the change fixed refuse a stranger; the ones it did not fix are still open, letting a stranger read your project, change what runs, and remove you
      frame: full

  - id: review
    theme: console
    eyebrow: The review
    title: The review of Onlook's fix leads with findings
    captions:
      - text: From those recordings, AppMap writes a review. It leads with the findings, one high, one medium, one low.
      - text: "The high finding blocks the merge, and explains the fix: Add a permission check to every operation that takes a project ID."
    media:
      kind: graphic
      graphic: review
      alt: "Findings ranked high, medium and low, the merge blocked, and the fix: one permission check on every operation"
      frame: full

  - id: proof
    theme: console
    eyebrow: Proof
    title: Important changes must be proven
    captions:
      - text: "For every important change, Gold Traces asks one question: is there a test whose recording shows the new behavior?"
      - text: If there isn't, the change isn't finished, and the review says which test is missing.
    media:
      kind: graphic
      graphic: proof
      alt: "Proven: a recording shows the new behavior. Not proven: the review names the test to add"
      frame: full

  - id: checks
    theme: console
    eyebrow: Checks performed
    title: Every check, on every change
    captions:
      - text: "Reading code can only show you so much."
      - text: "AppMap review finds the things code reads can miss: code outside the diff, missing permission checks, and new queries."
      - text: Every finding points to hard evidence - the runtime trace.
    media:
      kind: graphic
      graphic: checks
      alt: A review sees the changed lines; AppMap also finds side effects, missing permission checks and new queries, and every finding cites the recording
      frame: full
  - id: safe
    theme: console
    eyebrow: Safe to adopt
    title: Stays in your repository
    note: Diagram shows the swap, then the repository with a laptop and CI. The third caption (the review runs in your own coding agent) was cut; the diagram no longer claims it.
    captions:
      - text: Before a recording is committed, every value it captured, like a name or an email, is swapped for a placeholder.
      - text: The recordings live in your Git repository, next to your code, and run on a laptop or in CI.
    media:
      kind: graphic
      graphic: safe
      alt: A recorded value swapped for a placeholder before it is committed, and the recordings living in your Git repository beside the code, run from a laptop or CI
      frame: full

  - id: outro
    theme: statement
    title: AppMap Gold Traces
    captions:
      - text: Make every important change prove itself.
    cta: { label: Get AppMap at appmap.io, url: https://appmap.io, kind: link }
    media:
      kind: image
      asset: appmap-mark
      alt: "AppMap logo: a white A on a pink circle"
      motion: zoom-in
      frame: mark
