meta:
  title: Showcase Studio
  description: >
    Create videos of your app with the Claude Code subscription you already have - the video is files in your repo, Claude Code is the editor, and a teleprompter travels to your phone when it's time to record.
  loop: true
  captionStyle: karaoke
  notes: |-
    The studio, showcased by itself: every screenshot is the app capturing its own screens, and the diagrams are TSX graphics from this showcase's graphics/ folder — exactly the workflow the narration describes. The pitch: you can create videos of your app using the Claude Code subscription you already have.
    The voiceover in assets/voiceover.mp3 was recorded to the previous script and no longer matches these lines. Re-record it (the phone teleprompter reads exactly these captions), drop it back in assets/, then set "soundtrack: { src: voiceover, volume: 1, sync: true }" and re-pin each caption's durationMs to the take.

scenes:
  - id: setup
    theme: footage
    eyebrow: On camera
    note: >-
      The on-camera clips aren't recorded yet, so media stays kind: none on
      this scene and "handoff". When the takes exist, drop them in assets/,
      switch each scene's media to kind: video with the clip's asset key,
      and pin durationMs to the clip's real length.
    captions:
      - text: This video was made in a code editor. No video editor involved.
      - text: Everything you're watching was made with Showcase Studio.
    media:
      kind: none

  - id: handoff
    theme: footage
    eyebrow: On camera
    captions:
      - text: It's powered by Claude Code. It runs in your code repo. No video editor to learn, no new tool to pay for.
    media:
      kind: none

  - id: yaml
    theme: console
    eyebrow: Videos as code
    title: Change one word. Ship a new video.
    captions:
      - text: Under the hood, the video is stored as a YAML file in your repo.
      - text: Change a line or swap a screenshot, and the video re-renders. The words are the timing; scene length comes from the script, so shortening a sentence trims the scene.
    media:
      kind: graphic
      graphic: scene-yaml
      alt: The YAML for this very slide, syntax-highlighted, as it appears in showcase.yaml

  - id: claude
    theme: console
    eyebrow: The agent
    title: Ask Claude Code for the video you want
    captions:
      - text: Open the built-in terminal and start talking with Claude about the demo you want to make. It will use the knowledge it has about your project to help you brainstorm and create a script.
      - text: Claude edits the script, checks the slide, and renders a draft.
    media:
      kind: graphic
      graphic: claude-terminal
      alt: An embedded Claude Code session editing a scene, checking it, and exporting a draft

  - id: prompter
    theme: feature
    eyebrow: Recording
    title: Switch to your phone for video recording
    captions:
      - text: When it's time to record yourself, open the script in a custom URL on your phone. It scrolls the script like a teleprompter, and you can record yourself on your phone camera.
    media:
      kind: image
      asset: shot-prompter
      alt: The teleprompter on a phone, scrolling the script with pacing controls
      motion: still
      frame: phone

  - id: assets
    theme: feature
    eyebrow: The media
    title: Integrated asset catalog
    captions:
      - text: Use the Assets tab to drag and drop screenshots, voiceovers, and video clips. Then ask Claude to use the screenshot on scene 4, along with karaoke-style captions.
    media:
      kind: image
      asset: shot-assets-portrait
      alt: The assets page showing the media collection with usage details
      motion: still

  - id: export
    theme: console
    eyebrow: Export
    title: One script - three exports
    captions:
      - text: One script gives you a TikTok-style video, a widescreen YouTube video, and captioned screenshots for the App Store.
    media:
      kind: graphic
      graphic: player-formats
      alt: One showcase.yaml fanning out to the App Store, TikTok, and YouTube renditions

  - id: git
    theme: console
    eyebrow: Versioning
    title: Review, commit, revert
    captions:
      - text: Because it's all files, your video is git-managed. Review Claude's changes, commit, or revert.
      - text: Want to try a different cut? Branch it, and review the video the way you'd review code.
    media:
      kind: graphic
      graphic: git-lanes
      alt: A git commit graph of a showcase folder, with a new-cut branch merging back

  - id: install
    theme: statement
    eyebrow: Install
    title: Get it from GitHub
    captions:
      - text: Download Showcase Studio from GitHub and run it in your project folder.
    cta:
      kind: github
      label: View on GitHub
      url: https://github.com/kgilpin/showcase-studio
    ctaNote: github.com/kgilpin/showcase-studio
    media:
      kind: none

  - id: outro
    theme: statement
    title: Showcase Studio
    captions:
      - text: Videos of your app, made with the Claude Code you already have.
    media:
      kind: none
