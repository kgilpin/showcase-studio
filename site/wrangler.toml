# The Showcase Studio marketing site: a Cloudflare Worker that serves the
# static files in public/, uploaded as is; public/_headers sets the response
# headers. worker.js runs only for /media/*, to answer byte-range requests,
# which Safari needs to play the hero video, and for /download/*, the app's
# releases from the R2 bucket below (scripts/publish-release.mjs uploads
# them).
#   npm run dev:wrangler   serve public/ locally the way Cloudflare does (:8098)
#   npm run deploy         upload public/ and serve it at showcasestudio.dev
#   npm run deploy:preview upload a version without serving it, for a preview URL
# No account_id: wrangler deploys to the account it is logged in to, so the
# same config works after the domain moves accounts.
name = "showcase-studio"
compatibility_date = "2026-10-16"
main = "worker.js"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/media/*", "/download/*"]

[[routes]]
pattern = "showcasestudio.dev"
custom_domain = true

# The app's releases. The bucket must be in the account wrangler deploys
# to: create it once with
#   npx wrangler r2 bucket create showcase-studio-releases
[[r2_buckets]]
binding = "RELEASES"
bucket_name = "showcase-studio-releases"
