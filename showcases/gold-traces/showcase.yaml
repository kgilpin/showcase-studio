# =============================================================
# GOLD TRACES SHOWCASE — SCRIPT
#
# A showcase for the AppMap "gold traces" behavioral-review skills
# (appmap-gold-traces + appmap-review), focused on what runtime
# trace diffing catches that static analysis and LLM code review
# cannot. Grounded in the skill docs at
# ~/source/appland/skills/appmap-gold-traces.
#
# Media is a mix of real captures (assets/, ~1600x1000 landscape)
# and TSX-drawn diagrams (graphics/, kind: graphic — CSS-animated,
# themed via CSS variables). Remaining placeholder assets are
# labeled .svg files — replace each by deleting the .svg and adding
# the real capture as .png.
#
# ASSETS:
#   appmap-mark           the AppMap round mark (from appmap.io)
#   shot-manifest         gold_traces/manifest.yaml — curated entries (real)
#   shot-sql              AppMap sequence diagram with SQL + timings (real)
#   shot-sanitize         sanitized recording JSON, <v1>/<v8> tokens (real)
#
# GRAPHICS:
#   lifecycle             record → digest compare → bless/seed/unchanged
#   side-effects          diff vs. recorded call graph; out-of-scope call
#   absence               baseline path with authorize() vs. new path without
#   deterministic         sequence diagram + what the digest ignores
# =============================================================

meta:
  title: Gold Traces — Review the behavior, not the diff
  description: >-
    Recordings of how your code runs, committed in git and diffed on
    every release. Catches the side effects, dropped guards, and new
    queries that green tests and code review miss.
  loop: true
  soundtrack:
    src: ""
    volume: 0.18

scenes:
  - id: opening-1
    theme: statement
    eyebrow: Opening
    title: Your tests pass. Your diff looks clean.
    captions:
      - text: Your tests pass. Your diff looks clean.
    media:
      kind: none
    durationMs: 4000
    export: false

  - id: opening-2
    theme: statement
    eyebrow: Opening
    title: So why did checkout queries double? And where did the permission check go?
    captions:
      - text: So why did checkout queries double? And where did the permission check go?
    media:
      kind: none
    durationMs: 5000
    export: false

  - id: intro
    theme: statement
    title: AppMap Gold Traces
    captions:
      - text: AppMap Gold Traces
      - text: Catch the problems that unit tests and code reads miss.
    media:
      kind: image
      asset: appmap-mark
      alt: "AppMap logo: a white A on a pink circle"
      motion: zoom-in
      frame: mark
    durationMs: 5000
    export: false

  - id: baseline
    theme: console
    eyebrow: The baseline
    title: Record how the code runs. Commit the recordings.
    captions:
      - text: Curated tests walk the paths you care about. AppMap records each one as it runs.
        durationMs: 7500
      - text: The recordings go in git, a few kilobytes each. That's the baseline.
    media:
      kind: image
      asset: shot-manifest
      alt: gold_traces/manifest.yaml with curated entries grouped by feature
      motion: zoom-in
      frame: full
    durationMs: 14000
    export: false

  - id: lifecycle
    theme: console
    eyebrow: Record and bless
    title: Re-record on each release. Bless the intended changes.
    captions:
      - text: Each release is re-recorded and compared against the baseline. Unchanged traces stay untouched; changed ones are flagged.
        durationMs: 10000
      - text: Intended changes are blessed and committed. The rest stay byte-identical.
    media:
      kind: graphic
      graphic: lifecycle
      alt: "Diagram: gold tests are recorded, digest-compared to the committed baseline, and each trace is blessed, seeded, or left unchanged"
      frame: full
    durationMs: 14000
    export: false

  - id: side-effects
    theme: console
    eyebrow: Side effects
    title: "Scenario: An unintended behavior change"
    captions:
      - text: Suppose you touched the discount calculation; and now the trace shows the notification service now fires twice per order.
        durationMs: 7000
      - text: A code read wouldn't reveal this side effect. From a trace, it's obvious.
    media:
      kind: graphic
      graphic: side-effects
      alt: "Diagram: the diff's two files beside the recorded call graph, with a notification call highlighted outside the change's stated scope"
      frame: full
    durationMs: 14500
    export: false

  - id: absence
    theme: console
    eyebrow: Missing guards
    title: "Scenario: A dropped permission check"
    captions:
      - text: Some changes can silently skip or disable security checks; but tests still pass.
        durationMs: 7000
      - text: When a security-labeled function disappears from a code path, the behavior change is flagged.
    media:
      kind: graphic
      graphic: absence
      alt: "Diagram: the baseline call path runs authorize() with a security.authz label; the new path skips it, flagged in red, while tests pass"
      frame: full
    durationMs: 14000
    export: false

  - id: deterministic
    theme: console
    eyebrow: Change detection
    title: Changes are computed, not guessed or vibed
    captions:
      - text: "Each recording is reduced to a digest of its structure: the calls, their order, the queries. Timing and ephemeral values don't affect it."
        durationMs: 11000
      - text: Same input, same answer, every run. When a trace is flagged, behavior changed.
    media:
      kind: graphic
      graphic: deterministic
      alt: "Diagram: a sequence diagram with a security.authz label on the changed call, above a strip of digest-ignored values: elapsed time, ids, parameter values"
      frame: full
    durationMs: 17500
    export: false

  - id: sanitized
    theme: console
    eyebrow: Safe to commit
    title: The recordings themselves hold no secret or private data
    captions:
      - text: Before a recording goes into git, every captured value is replaced with a meaningless token.
        durationMs: 8500
      - text: So committed traces never contain secrets like customer data or environment keys.
    media:
      kind: image
      asset: shot-sanitize
      alt: "Sanitized recording JSON: parameter values replaced by tokens like <v1> and <v8>"
      motion: zoom-in
      frame: full
    durationMs: 14000
    export: false

  - id: outro
    theme: statement
    title: Gold Traces
    captions:
      - text: Gold Traces
      - text: Behavioral review for every release
    cta:
      label: Learn more at appmap.io
      url: https://appmap.io
      kind: link
    media:
      kind: image
      asset: appmap-mark
      alt: "AppMap logo: a white A on a pink circle"
      motion: zoom-in
      frame: mark
    durationMs: 7000
    export: false
