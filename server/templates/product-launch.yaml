name: Product launch
description: A whole product, new to the viewer. One promise, then two or three of its features as proof. About a minute.

meta:
  targetMs: 60000
  sceneMaxMs: 8000

guidance: |
  A product launch tells the viewer something new exists and gives them a
  reason to try it today. It covers more ground than a feature explainer,
  but it still makes one promise and shows two or three things that keep
  it.

  - title: the name of the product and one line on what it does, on a
    statement slide.
  - problem: what goes wrong or takes too long without it, stated plainly.
  - proof-1, proof-2, proof-3: one feature each, shown working, each tied
    back to the promise. Use the strongest first. Two is fine; never more
    than three. They are separate features, not several results of one
    feature: for one feature that finds several things, use the
    worked-example template.
  - who: who it is for, so the right viewer knows it is them.
  - end: where to get it, the price if it is free or simple, and a cta.

  Narration should sound like a person talking, not a press release. Say
  "you", not "users". Ask the user for the screenshots or recordings
  before you write captions that describe them.

titles:
  good:
    - Tally fills in your budget from your bank statements
    - Tally files every receipt you photograph
  bad:
    - Stop retyping your week
    - Tired of budgeting?
    - The next generation of productivity
    - Tally v1.0 is now available on all platforms

captions:
  good:
    - "Tally reads your bank statements and fills in your budget for you."
    - "So at the end of the month, the numbers are already there."
  bad:
    - "Your budget. Automated."
    - "AI-powered budgeting for everyone."

scenes:
  - id: title
    theme: statement
    eyebrow: title
    title: The product's name and what it does
    note: The title scene, with the product's name and its promise in one line. App mark media fits here.
    captions:
      - text: Say the name and what it does, in one plain sentence.
  - id: problem
    theme: statement
    title: The problem it solves
    note: What goes wrong or takes too long without it, stated plainly.
    captions:
      - text: Say the problem in one plain sentence.
  - id: proof-1
    theme: feature
    title: The strongest feature
    note: The feature that keeps the promise best, shown working.
    captions:
      - text: Say what the viewer sees happening.
  - id: proof-2
    theme: feature
    title: The second feature
    note: A second feature, tied back to the promise.
    captions:
      - text: Say what the viewer sees happening.
  - id: proof-3
    theme: feature
    title: The third feature
    note: Optional. Delete this scene if two features make the case.
    captions:
      - text: Say what the viewer sees happening.
  - id: who
    theme: statement
    title: Who it is for
    note: Who it is for, so the right viewer knows it is them.
    captions:
      - text: Say who this is for.
  - id: end
    theme: statement
    title: Where to get it
    note: Where to get it, and the price if it is simple. Add a cta.
    captions:
      - text: Say where to get it.
