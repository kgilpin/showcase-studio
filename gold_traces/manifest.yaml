# Gold-traces manifest (managed by the appmap-gold-traces skill,
# vendor/appmap-skills — exposed as .claude/skills/appmap-gold-traces).
#
# The curated behavioral baseline: one lean, deterministic trace per
# node-testable subsystem — the timing model, the YAML edit write path
# (happy path + a rejection gate), and the data server (index, byte
# ranges, and the traversal gate). Record command and entry paths are
# derived; see the skill's SKILL.md.

schema_version: 1

commands:
  record: 'npx appmap-node npx vitest run {test_file} -t "{test_name}"'

entries:
  - feature: timing
    test_file: src/content/timing.test.ts
    test_name: sums the captions and returns them with concrete times
    appmap_path: vitest/sums_the_captions_and_returns_them_with_concrete_times.appmap.json
    summary: Derived-mode slide timing — caption pricing through readingTime into concrete windows.

  - feature: timing
    test_file: src/content/timing.test.ts
    test_name: attaches slide-relative word windows from a transcript
    appmap_path: vitest/attaches_slide-relative_word_windows_from_a_transcript.appmap.json
    summary: Whisper-exact caption sync — transcript words matched to the narration in order.

  - feature: scene-edit
    test_file: server/scene-edit.test.mjs
    test_name: creates theme.yaml on first use and returns its hash
    appmap_path: vitest/creates_theme.yaml_on_first_use_and_returns_its_hash.appmap.json
    summary: The style panel's theme.yaml write path — whitelisted edit on a file created on demand.

  - feature: scene-edit
    test_file: server/scene-edit.test.mjs
    test_name: applies the edit and returns the written file's content hash
    appmap_path: "vitest/applies_the_edit_and_returns_the_written_file's_content_hash.appmap.json"
    summary: The full backend write path — resolve, hash-gate, patch, write, return the new hash.

  - feature: scene-edit
    test_file: server/scene-edit.test.mjs
    test_name: refuses a stale baseHash and leaves the file untouched
    appmap_path: vitest/refuses_a_stale_baseHash_and_leaves_the_file_untouched.appmap.json
    summary: The stale-base gate's negative branch — refusal before the patch is even computed.

  - feature: scene-edit
    test_file: server/scene-edit.test.mjs
    test_name: returns the edit error when the YAML rejects the edit, leaving the file untouched
    appmap_path: "vitest/returns_the_edit_error_when_the_YAML_rejects_the_edit,_leaving_the_file_untouched.appmap.json"
    summary: The whitelist gate's negative branch — the YAML edit throws and nothing is written.

  - feature: data-server
    test_file: server/showcase-data.test.mjs
    test_name: serves index.json with the folder's index
    appmap_path: "vitest/serves_index.json_with_the_folder's_index.appmap.json"
    summary: The index listing — folder discovery into the data shape the app loads.

  - feature: data-server
    test_file: server/showcase-data.test.mjs
    test_name: serves a bounded range as a 206 slice
    appmap_path: vitest/serves_a_bounded_range_as_a_206_slice.appmap.json
    summary: Byte-range slicing for media seeking — request through file lookup to a 206.

  - feature: data-server
    test_file: server/showcase-data.test.mjs
    test_name: rejects unsatisfiable and malformed ranges with 416
    appmap_path: vitest/rejects_unsatisfiable_and_malformed_ranges_with_416.appmap.json
    summary: The range parser's negative branches — malformed and out-of-bounds ranges 416.

  - feature: data-server
    test_file: server/showcase-data.test.mjs
    test_name: refuses .. traversal, including URL-encoded
    appmap_path: "vitest/refuses_.._traversal,_including_URL-encoded.appmap.json"
    summary: The path-safety gate's negative branch — traversal never resolves to a file.
