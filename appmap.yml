# AppMap recording config for the studio module — the app whose
# package.json is at the repo root: server/, src/, scripts/ and electron/.
# Not the whole repo: each other module has its own (cdk/appmap.yml for
# the AWS Lambdas). Recordings land in tmp/appmap (gitignored); the
# blessed gold-trace baselines live in gold_traces/.
name: showcase_demo
language: javascript
appmap_dir: tmp/appmap
# appmap-node nests the calls an async function makes under it only while
# its async tracking is on, and it turns that off for the rest of the
# vitest worker once the worker's first buffered call is older than this
# limit (3000 ms by default). So a test's shape depended on how long the
# tests before it in the same worker took: on a slower machine, or with
# slower git, the same test recorded flat instead of nested. An hour is
# longer than any run, so every test keeps the nested shape.
async_tracking_timeout: 3600000
packages:
  - path: server
    exclude:
      # A recursive walk over every node of a YAML document, so its call
      # count tracks the document's size and nothing else — hundreds of
      # calls that say the same thing. Its own behavior is covered by
      # server/yaml-text.test.mjs, and its callers stay in the trace.
      - blockScalars
      # Which advice the guide gives for installing whisper depends on
      # whether this machine has one — so recording it makes a trace say
      # more about the machine than about the code. The lookup itself
      # (whisperPath) stays.
      - whisperAdvice
      # Where git is (server/git-program.mjs): every git command asks
      # gitProgram, and the first one in a process also searches PATH
      # (findOnPath) while later ones only check the file is still there
      # (isFile). So which trace gets the search depends on which test ran
      # git first in that vitest run, not on the code. The lookup is
      # covered by server/git-program.test.mjs; the git calls that use it
      # (showcase-history.git and others) stay in the trace.
      - gitProgram
      - findOnPath
      - isFile
  - path: scripts
  - path: electron
  - path: src
    exclude:
      # The schema check's walk over the schema for a field's other
      # homes, and its path spelling: a recursion over every node of the
      # schema, hundreds of calls that say the same thing, for one
      # warning. checkShowcase and check stay in the trace.
      - homesOf
      - joinPath
      - spellPath
      - matchesType
      - typeOf
      - distance
