# Cloudflare Pages project for the Showcase Studio marketing site.
# The site is plain static files: everything in public/ is uploaded as is.
#   npm run dev:wrangler   serve public/ locally the way Pages does (:8098)
#   npm run deploy         upload public/ as the production deployment
name = "showcase-studio"
pages_build_output_dir = "public"
compatibility_date = "2026-10-01"
