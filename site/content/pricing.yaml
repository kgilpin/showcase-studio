# The Pricing page: the trial and the subscription side by side, then
# questions about the subscription (keep those here, not in the FAQ). The
# inline tags allowed in text are listed at the top of shared.yaml. The
# Subscribe button and the Stripe link are wired in src/license-service.ts.

head:
  title: Pricing
  description: >-
    Free to try: two full-quality video exports on each computer, and drafts
    are always free. Then $9.50/month for unlimited full-quality videos.

title: Pricing
lede: Try everything for free. Subscribe to export and publish unlimited full-quality videos.

# The two cards. Each lists its first line, then everything in included.
plans:
  trial:
    name: Trial
    price: Free
    first: <strong>Two full-quality video exports</strong> on each computer
    button: Download
  subscription:
    name: Subscription
    price: $9.50
    per: / month
    first: <strong>Unlimited video exports</strong>
    button: Subscribe
    note: Or subscribe from within the app

# The same on both plans: the trial has everything, and only the number of
# full-quality exports differs.
included:
  - <strong>Unlimited drafts</strong> to check your work
  - App Store screenshots and script export
  - Teleprompter mode, on your computer or your phone
  - Captions and integrated audio
  - Filters, effects, watermarks and badges
  - Custom-generated graphics and animations
  - Sharing to TikTok, Instagram and YouTube

questions_title: Questions
questions:
  - q: What counts as a full-quality video?
    a: >-
      The 1080×1920 video for short-form video (TikTok, Reels, YouTube
      Shorts), and the 4:3 YouTube export. Drafts, App Store screenshots and
      the script never count.

  - q: Where's my license key?
    a: >-
      In the app: open the gear button at the top right, and it's under
      <strong>Subscription</strong>, with a Copy button. You're also emailed
      the license key when you subscribe, and it's on each invoice.

  - q: How do I cancel, or change my card?
    a: >-
      In the app, open the gear button and choose <strong>Manage
      subscription</strong>. Or, <a href="portal">manage your subscription
      here</a> at Stripe.

  - q: What about tax?
    a: Payments go through Stripe, which adds any sales tax or VAT where you live.
