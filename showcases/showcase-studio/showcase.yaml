# =============================================================
# SHOWCASE STUDIO — the studio, showcased by itself.
#
# Every screenshot here is the app capturing its own screens, and the
# diagrams are TSX graphics from this showcase's graphics/ folder —
# exactly the workflow the narration describes.
# =============================================================

meta:
  title: Showcase Studio
  description: >
    Showcase videos as code - create, edit, and version your app's video tours inside your own repo, with Claude Code embedded, git for history, and a teleprompter that travels to your phone.
  loop: true
  soundtrack: { src: "voiceover", volume: 1, sync: true }

scenes:
  # ---- ON CAMERA - THE SETUP ------------------------------------
  # The narrator setting up the video, on camera. The clips aren't
  # recorded yet, so media stays "none" for now — when the takes exist
  # (the phone teleprompter is the tool for exactly this: these
  # captions are the lines to read), drop them in assets/ and switch
  # each scene's media to {kind: video, asset: <clip>, alt: ...},
  # pinning durationMs to the clip's real length.
  #
  # NOTE: the voiceover track still opens with the old intro line
  # ("Your repo is the video") - once the takes are in, their own
  # audio is the narration for these two scenes, so re-cut
  # assets/voiceover.mp3 to start after that line and re-pin the
  # later captions.
  - id: setup
    theme: footage
    eyebrow: On camera
    captions:
      - text: Are you frustrated with video editors like CapCut? A video demo is a great way to show off your app - but creating and refining these videos is tedious.
    media:
      kind: none

  - id: handoff
    theme: footage
    eyebrow: On camera
    captions:
      - text: I've integrated video production into your code repo - so the whole process is streamlined, and it's powered by the Claude Code subscription you already have.
    media:
      kind: none

  # ---- THE CONCEPT ----------------------------------------------
  - id: diff
    theme: console
    eyebrow: Videos as code
    title: Change one word. Ship a new video.
    captions:
      - text: You can update a screenshot, and re-render the video automatically.
        durationMs: 4890
      - text: There's no timeline to drag around - the words are the timing.
        durationMs: 4080
    media:
      kind: graphic
      graphic: caption-diff
      alt: A one-line git diff of a caption re-rendering the slide beneath it

  # ---- THE PLAYER -----------------------------------------------
  - id: player
    theme: console
    eyebrow: The player
    title: One script - three output formats
    captions:
      - text: Video, screenshots, and captions all auto-play together.
        durationMs: 3350
      - text: And you can export to App Store, TikTok, and YouTube.
        durationMs: 4040
    media:
      kind: graphic
      graphic: player-formats
      alt: One showcase.yaml fanning out to the App Store, TikTok, and YouTube renditions

  # ---- THE AGENT ------------------------------------------------
  - id: claude
    theme: console
    eyebrow: The agent
    title: Built-in Claude Code
    captions:
      - text: Claude Code is built-in for advanced editing - using the subscription you already have.
        durationMs: 5170
      - text: ""
        durationMs: 6340
    media:
      kind: graphic
      graphic: claude-terminal
      alt: An embedded Claude Code session editing a scene, checking it, and exporting a draft

  # ---- THE MEDIA ------------------------------------------------
  - id: assets
    theme: feature
    eyebrow: The media
    title: Integrated asset catalog
    captions:
      - text: You can manage media assets, like screenshots, voiceovers, and video clips, using drag and drop.
        durationMs: 7080
    media:
      kind: image
      asset: shot-assets-portrait
      alt: The assets page showing the media collection with usage details
      motion: still

  # ---- VERSIONING -----------------------------------------------
  - id: git
    theme: console
    eyebrow: Versioning
    title: Diff, review, commit
    captions:
      - text: Your entire video is git-managed files. Review, commit, and revert as you wish.
        durationMs: 6110
      - text: Want to try a different cut? Branch it, and review the video the way you'd review code.
        durationMs: 5960
    media:
      kind: graphic
      graphic: git-lanes
      alt: A git commit graph of a showcase folder, with a new-cut branch merging back

  # ---- RECORDING ------------------------------------------------
  - id: prompter
    theme: feature
    eyebrow: Recording
    title: Switch to your phone for video recording
    captions:
      - text: When it's time to record yourself, send the script to your phone.
        durationMs: 3880
      - text: The teleprompter scrolls at speaking pace while you film your take — wherever you are.
        durationMs: 5330
    media:
      kind: image
      asset: shot-prompter
      alt: The teleprompter on a phone, scrolling the script with pacing controls
      motion: still
      frame: phone

  # ---- OUTRO ----------------------------------------------------
  - id: outro
    theme: statement
    title: Showcase Studio
    captions:
      - text: Your repo is the video.
        durationMs: 3500
    media:
      kind: none
