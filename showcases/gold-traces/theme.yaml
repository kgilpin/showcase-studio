# =============================================================
# GOLD TRACES SHOWCASE — THEME
#
# Matches appmap.io as of 2026-09: deep violet-black background
# (#0d0a1a), near-white violet text (#f2effb / #a99fc7), hot pink
# #ff07aa with a pink → magenta gradient, and the site's heavy,
# tightly tracked headings. The site uses the system font stack;
# Inter is the closest free match and renders the same on every
# machine that exports the video. Inter Tight is loaded at 800 only,
# so titles pick up the site's heavy heading weight.
# =============================================================

colors:
  background: "#0d0a1a"
  foreground: "#f2effb"
  card: "#16112b"
  card-foreground: "#f2effb"
  primary: "#ff07aa"
  primary-foreground: "#ffffff"
  secondary: "#0f0b1d"
  secondary-foreground: "#f2effb"
  muted: "#1c1538"
  muted-foreground: "#a99fc7"
  accent: "#8b5cf6"
  accent-foreground: "#ffffff"
  border: "rgba(167, 139, 250, 0.22)"
  support: "#7c8aa6"
  caption-chip: "rgba(15, 11, 29, 0.85)"
  caption-text: "#f2effb"
  caption-word: "#ff07aa"

fonts:
  display: '"Inter Tight", "Inter", ui-sans-serif, system-ui, sans-serif'
  body: '"Inter", ui-sans-serif, system-ui, sans-serif'
  load:
    - https://fonts.googleapis.com/css2?family=Inter+Tight:wght@800&display=swap
    - https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap

atmosphere:
  # The site's page gradient, plus a faint pink glow at the top.
  gradient-stage: >-
    radial-gradient(120% 70% at 50% 0%, rgba(255, 7, 170, 0.12),
    transparent 60%), linear-gradient(180deg, #131024 0%, #0d0a1a 100%)
  gradient-accent: "linear-gradient(90deg, #ff07aa 0%, #a21caf 100%)"
  shadow-device: >-
    0 40px 120px -30px rgba(0, 0, 0, 0.9), 0 0 90px -20px
    rgba(255, 7, 170, 0.25)
