meta:
  title: Showcase Studio
  description: "Showcase Studio is a Claude Code plugin: make videos of your app with the Claude Code subscription you already have, using every tool and file on your machine."
  loop: true
  captionStyle: karaoke
  notes: |-
    Script draft for the plugin pitch: Showcase Studio runs as a Claude Code plugin, so it uses the subscription you already have, every tool on your machine, and plain files you can share across projects.
    Voiceover: a synthesized draft, assets/voiceover-synth.m4a, made with AWS Polly's generative Matthew voice (kgilpin profile, us-east-1): one clip per caption (24 kHz mp3), each placed in a window of 250 ms lead + spoken length (rounded up to the millisecond) + 450 ms tail; the last caption holds 1.5 s more for the end card. Every caption's durationMs is pinned to its window, and the windows sum to 53680 ms, the audio's length. assets/voiceover-synth.words.json has one segment per caption window, with the caption's own words and the transcribe tool's word times fitted into the span where that caption's clip is voiced (whisper drifts across caption boundaries, so its times aren't used as they come). After any caption edit, synthesize again, re-pin, and rebuild the words file, or the voice drifts out of sync. Last made 2026-10-15.
    The on-camera scene still plays assets/scene-1-setup.mp4, an old clip that says the previous script. The master recording it was cut from, and an earlier recorded voiceover, were dropped from this folder: these showcases ship as examples, so only the files the slides use are kept. To record for real: read the final script on the phone teleprompter, cut a new on-camera clip, then point soundtrack at the new recording, re-pin, and replace the words file.
  soundtrack: { src: voiceover-synth, volume: 1, sync: true }

scenes:
  - id: setup
    theme: footage
    eyebrow: On camera
    note: "The on-camera hook, to be re-recorded. Until then it plays the old clip assets/scene-1-setup.mp4, which says the previous line, and the timing follows the new words, so the clip is cut short. fit: contain keeps the landscape framing on the portrait stage. The master recording this was cut from is no longer in the folder (see meta.notes)."
    captions:
      - text: I made this video with Showcase Studio, a Claude Code plugin.
        durationMs: 4516
    media:
      kind: video
      asset: scene-1-setup
      alt: "The narrator on camera: this video was made with Claude Code inside the app's own repo"
      fit: contain

  - id: plugin
    theme: console
    eyebrow: The plugin
    title: Right inside the Claude Code you already have
    captions:
      - text: Type /showcase, and the studio opens right beside your chat.
        durationMs: 4252
    media:
      kind: graphic
      graphic: showcase-command
      alt: "Claude Code Desktop: /showcase is typed into the chat, and the studio opens in the Browser pane beside it"
    note: "The graphic is graphics/showcase-command.tsx, a stylized Claude Code Desktop window: /showcase types into the chat, Claude answers, and the studio slides open in the Browser pane."
  - id: director
    theme: statement
    eyebrow: Directing
    title: Be the director.
    captions:
      - text: Be the director.
        durationMs: 1732
      - text: Showcase Studio and Claude do the rest.
        durationMs: 2980
    media:
      kind: none
  - id: tools
    theme: console
    eyebrow: Your tools
    title: Every tool on your machine
    note: The screenshot shows Claude choosing AWS Polly voices on the user's own account to make a voiceover, with the studio playing beside the chat.
    captions:
      - text: You can use all the power and context of Claude.
        durationMs: 3412
      - text: Here it makes a voiceover with my own AWS account.
        durationMs: 3748
    media:
      kind: image
      asset: shot-claude-desktop
      alt: Claude picking an AWS Polly voice and building voiceover clips, with the studio playing beside the chat
      motion: still

  - id: prompter
    theme: feature
    eyebrow: Recording
    title: Switch to your phone for video recording
    captions:
      - text: You can record video using the built-in teleprompter
        durationMs: 3580
      - text: on your computer or on your phone.
        durationMs: 2764
    media:
      kind: image
      asset: shot-prompter
      alt: The teleprompter on a phone, scrolling the script with pacing controls
      motion: still
      frame: phone
  - id: files
    theme: feature
    eyebrow: Your files
    title: Plain files on your machine
    captions:
      - text: "The script, screenshots, and other media are all ordinary files on your computer."
        durationMs: 5404
      - text: Drag in a new clip or screenshot, and it's ready to use.
        durationMs: 3796
    media:
      kind: image
      asset: shot-assets-portrait
      alt: The assets page listing the project's screenshots, recordings, and where each is used
      motion: still

  - id: export
    theme: console
    eyebrow: Export
    title: One script - three exports
    captions:
      - text: When you're done, you can export in "shorts" format, widescreen, and captioned screenshots for the App Store.
        durationMs: 6676
    media:
      kind: graphic
      graphic: player-formats
      alt: One showcase.yaml fanning out to the App Store, TikTok, and YouTube renditions

  - id: outro
    theme: console
    title: Showcase Studio
    captions:
      - text: Videos of your app, made with the Claude Code you already have.
        durationMs: 4180
      - text: Add the Showcase Studio plugin to Claude Code, and make your first video today.
        durationMs: 6640
    media:
      kind: graphic
      graphic: plugin-install
      alt: "A terminal: the two commands that add the Showcase Studio plugin type in, each confirmed, then a hint to type /showcase in Claude Code"
    eyebrow: Get it
    cta: { kind: github, label: View on GitHub, url: https://github.com/kgilpin/showcase-studio }
    ctaNote: github.com/kgilpin/showcase-studio
    note: 'The graphic is graphics/plugin-install.tsx, a stylized terminal: the two plugin commands from the README type in on the second caption ("Add the Showcase Studio plugin...", about 4.4 s in). Retime its FIRST constant if that caption moves.'
